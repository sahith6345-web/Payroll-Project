version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: payroll-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=payroll_db
    volumes:
      - mongo-data:/data/db
    networks:
      - payroll-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payroll-backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/payroll_db
    depends_on:
      - mongodb
    networks:
      - payroll-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payroll-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - payroll-net

networks:
  payroll-net:
    driver: bridge

volumes:
  mongo-data:
